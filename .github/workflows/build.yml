name: build
on:
  schedule:
    - cron: "20 6 * * *"   # daily 06:20 UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m modelwatch.build
        env:
          ARTIFICIALANALYSIS_API_KEY: ${{ secrets.ARTIFICIALANALYSIS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: unmatched, path: unmatched.txt, if-no-files-found: ignore }
      - name: Commit data
        run: |
          git config user.name "model-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily data refresh"
          git push
      - name: Weekly model suggestions
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%u)" = "1" ] || exit 0   # Mondays only (UTC)
          [ -f data/suggestions.json ] || exit 0  # nothing to report
          python scripts/format_suggestions.py data/suggestions.json > body.md
          n="$(gh issue list --search '"🔭 New model suggestions" in:title' --state open --json number --jq '.[0].number')"
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file body.md
          else
            gh issue create --title "🔭 New model suggestions" --body-file body.md
          fi
